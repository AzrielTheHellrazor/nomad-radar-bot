name: NomadRadar Günlük Ucuz Seyahat Taraması (0$ Serverless)

on:
  schedule:
    # Her gün Türkiye saatiyle 10:00'da (UTC 07:00) otomatik çalışır
    - cron: '0 7 * * *'
  workflow_dispatch: # GitHub üzerinden tek tıkla manuel de tetiklenebilir

jobs:
  daily-travel-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repo Kodunu Çek
        uses: actions/checkout@v4

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: pip install -r requirements.txt

      - name: Günlük Fırsat Taramasını Çalıştır ve Telegram'a Gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --scan-once
