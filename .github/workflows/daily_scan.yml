name: NomadRadar Günlük Ucuz Seyahat Taraması (0$ Serverless)

on:
  schedule:
    # GitHub Actions tepe saat (:00) yoğunluğuna takılmamak için küsuratlı dakikalarda (TR saatiyle 09:23 ve 20:23) çalışır
    - cron: '23 6 * * *'
    - cron: '23 17 * * *'
  workflow_dispatch: # GitHub üzerinden tek tıkla manuel de tetiklenebilir

jobs:
  daily-travel-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repo Kodunu Çek
        uses: actions/checkout@v4

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: pip install -r requirements.txt

      - name: SQLite Veritabanı Durumunu Geri Yükle (actions/cache@v4)
        uses: actions/cache/restore@v4
        id: restore-db-cache
        with:
          path: nomad_radar.db
          key: nomad-radar-db-${{ github.run_id }}
          restore-keys: |
            nomad-radar-db-

      - name: Günlük Fırsat Taramasını Çalıştır ve Telegram'a Gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python main.py --scan-once

      - name: SQLite Veritabanı Durumunu Kaydet (actions/cache@v4)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: nomad_radar.db
          key: nomad-radar-db-${{ github.run_id }}
